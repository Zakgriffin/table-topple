<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sphere Lab — Mobile Capture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; height: 100%; }
  /* video#v is just the MediaStream sink now -- never shown. captureCanvas
     (below) is the actual viewfinder, so what's on screen is pixel-for-pixel
     what gets analyzed/sent, not a separate resolution -- see this
     session's chat, "one canvas, one capture". Best-fit-to-screen: aspect
     ratio preserved (whatever the resolution dropdown's own selection is),
     scaled up as large as possible without clipping outside the viewport --
     the standard max-width/max-height letterbox, not a crop. */
  video#v { display: none; }
  canvas#captureCanvas {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100vw; max-height: 100vh;
  }
  /* AR overlay -- a transparent THREE.js canvas placed exactly over
     captureCanvas (see gameOverlay.ts's syncOverlayRendererSize, which keeps
     its intrinsic buffer dimensions identical to captureCanvas's own, so
     the SAME letterbox fit below scales/positions both identically),
     rendering the BOARD GAME (src/game, via src/gameOverlay.ts) from a
     camera at the recovered pose (same FOV/aspect the pose pipeline itself
     used) -- so when computeOnDevice's decode is good, the virtual board
     visually lands on the real printed pattern in the live feed underneath
     it. Both boards are 144 cells across, so that landing is 1:1, cell for
     cell. No mirror class here either -- captureCanvas's own draw already
     bakes in the front-camera flip at the pixel level (see
     drawCurrentFrameToCanvas), so the AR overlay just lines up with
     whatever's already correctly oriented. */
  canvas#arCanvas {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100vw; max-height: 100vh;
    pointer-events: none; z-index: 5;
    display: none;
  }
  canvas#arCanvas.visible { display: block; }
  #status {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
    display: flex; justify-content: space-between; z-index: 10;
    font-family: monospace; font-size: 13px;
    text-shadow: 0 0 6px #000, 0 0 6px #000;
  }
  #camStatus { color: #0f0; }
  #relayStatus { color: #6cf; }
  #relayStatus.down { color: #f66; }
  #shutter {
    position: fixed; bottom: max(36px, calc(env(safe-area-inset-bottom) + 24px)); left: 50%;
    transform: translateX(-50%); z-index: 10;
    width: 84px; height: 84px; border-radius: 50%;
    border: 4px solid #fff; background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px); transition: background 0.15s ease;
  }
  #shutter:active { background: rgba(255,255,255,0.45); }
  /* Sphere Lab is still crunching the last frame -- shown regardless of
     photo/video mode. #shutter.sent (the brief post-send flash) is declared
     after this on purpose so it wins for its 300ms even if a capture
     happens to land right as we optimistically go not-ready. */
  #shutter.notReady { background: rgba(230,200,20,0.75); border-color: #fd0; }
  #shutter.sent { background: rgba(60,220,110,0.75); border-color: #6f6; }
  #modeToggle {
    position: fixed; bottom: max(196px, calc(env(safe-area-inset-bottom) + 184px)); left: 50%;
    transform: translateX(-50%); z-index: 10;
    display: flex; gap: 4px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
    border-radius: 999px; padding: 4px;
  }
  #modeToggle button {
    border: none; background: transparent; color: #ccc;
    font-family: monospace; font-size: 12px; padding: 6px 16px; border-radius: 999px;
  }
  #modeToggle button.active { background: rgba(255,255,255,0.25); color: #fff; }
  #switchCam {
    position: fixed; bottom: max(52px, calc(env(safe-area-inset-bottom) + 40px)); right: 24px; z-index: 10;
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 22px;
    backdrop-filter: blur(4px);
  }
  #zoomBox {
    position: fixed; bottom: max(150px, calc(env(safe-area-inset-bottom) + 138px)); left: 24px; right: 24px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
    border-radius: 999px; padding: 10px 20px;
  }
  #zoomBox span { color: #fff; font-family: monospace; font-size: 13px; }
  #zoom { flex: 1; accent-color: #0f0; height: 20px; }
  #zoom:disabled { accent-color: #f00; opacity: 0.5; }
  #resBox {
    position: fixed; bottom: max(242px, calc(env(safe-area-inset-bottom) + 230px)); left: 24px; right: 24px; z-index: 10;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
    border-radius: 18px; padding: 10px 20px;
  }
  #resBox span { color: #fff; font-family: monospace; font-size: 13px; }
  /* Candidates confirmed unsupported by sweepResolutionCandidates
     (mobileCapture.ts) are left OUT of this list entirely, not shown
     disabled -- the full detail of why each one failed lives in the probe
     log panel below instead (#probeLogPanel). */
  #resBox select {
    flex: 1; min-width: 80px; background: rgba(0,0,0,0.4); color: #fff;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 6px;
    padding: 4px 8px; font-family: monospace; font-size: 13px;
  }
  #resBox select:disabled { opacity: 0.5; }
  /* Deliberately a manual, deliberate action, not something that runs
     automatically -- see sweepResolutionCandidates' own comment: an
     unpaced auto-run of this crashed Chrome on a real phone. */
  #resBox button {
    background: rgba(255,255,255,0.25); color: #fff; border: none;
    border-radius: 999px; padding: 6px 12px; font-family: monospace; font-size: 12px;
    white-space: nowrap; flex-shrink: 0;
  }
  #resBox button:disabled { opacity: 0.5; }
  /* Diagnostic table of every probe the last sweep actually ran -- see
     mobileCapture.ts's ProbeLogEntry/renderProbeLog: what resolution was
     requested, did getUserMedia even resolve, what did the camera ACTUALLY
     settle on (via `ideal`, so this is populated even on a "no match"),
     and did that match the request. Hidden by default; #probeLogToggleBtn
     (in #resBox) opens it. */
  #probeLogPanel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(92vw, 480px); max-height: 70vh; overflow-y: auto;
    background: rgba(10,10,10,0.95); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 10px; padding: 12px; z-index: 30;
    font-family: monospace; font-size: 12px; color: #fff;
    display: none;
  }
  #probeLogPanel.visible { display: block; }
  #probeLogPanel .probeLogHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #probeLogPanel .probeLogHeader span { font-weight: bold; }
  #probeLogPanel .probeLogHeader button {
    background: rgba(255,255,255,0.2); color: #fff; border: none;
    border-radius: 6px; padding: 2px 10px; font-family: monospace; font-size: 14px;
  }
  #probeLogPanel table { width: 100%; border-collapse: collapse; }
  #probeLogPanel th, #probeLogPanel td {
    padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.15); text-align: left; white-space: nowrap;
  }
  #probeLogPanel tr.pass td:last-child { color: #6f6; }
  #probeLogPanel tr.fail td:last-child { color: #f66; }
  /* Frame rate -- bounds are 1fps (a full second between frames, the
     slowest end anyone would want) to whatever the camera's own
     getCapabilities().frameRate.max reports as fastest (see
     setupFramerateControl in mobileCapture.ts) -- a lever against motion
     blur: a higher requested rate caps how long auto-exposure is allowed to
     leave the shutter open, since exposure can't exceed the frame interval. */
  #fpsBox {
    position: fixed; bottom: max(288px, calc(env(safe-area-inset-bottom) + 276px)); left: 24px; right: 24px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
    border-radius: 999px; padding: 10px 20px;
  }
  #fpsBox span { color: #fff; font-family: monospace; font-size: 13px; }
  #fpsValue { min-width: 56px; text-align: right; }
  #fps { flex: 1; accent-color: #0f0; height: 20px; }
  #fps:disabled { opacity: 0.5; }
  /* "Compute pose on this device" -- orthogonal to modeToggle's single/video
     axis, so its own row rather than crowded into that one. See this
     session's on-device-pose-recovery plan. */
  #computeToggle {
    position: fixed; bottom: max(330px, calc(env(safe-area-inset-bottom) + 318px)); left: 50%;
    transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px; align-items: center;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
    border-radius: 999px; padding: 6px 16px;
  }
  #computeToggle label { color: #ccc; font-family: monospace; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  #computeToggle input { accent-color: #0f0; }
  /* Independent of computeToggle above -- an AR overlay showing the board
     game standing on the recovered floor works whether the pose came from
     THIS device (computeOnDevice on) or was synced back down from the
     desktop after IT computed one (poseSync, see mobileCapture.ts). */
  #arToggle {
    position: fixed; bottom: max(372px, calc(env(safe-area-inset-bottom) + 360px)); left: 50%;
    transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px; align-items: center;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
    border-radius: 999px; padding: 6px 16px;
  }
  #arToggle label { color: #ccc; font-family: monospace; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  #arToggle input { accent-color: #33aaff; }
  /* Debug-only, OFF by default -- extra payload on top of the poseResult
     message (raw image bytes and/or intermediate pipeline data), both a
     real per-frame cost (JPEG encode, extra serialization), so each is its
     own toggle rather than riding along with computeOnDevice automatically.
     See this session's on-device-pose-recovery plan's "extensibility"
     design goal. */
  #debugToggles {
    position: fixed; bottom: max(414px, calc(env(safe-area-inset-bottom) + 402px)); left: 50%;
    transform: translateX(-50%); z-index: 10;
    display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
    border-radius: 12px; padding: 6px 16px;
  }
  #debugToggles label { color: #ccc; font-family: monospace; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  #debugToggles input { accent-color: #f80; }
  /* white-space: pre-line so updateImuReadout's two-line string breaks where
     its \n says to, without needing markup for the second line. :empty
     collapses the box entirely when the toggle is off, so an unused readout
     costs no vertical space in the flex column above it. */
  #imuReadout { color: #9cf; font-family: monospace; font-size: 11px; white-space: pre-line; line-height: 1.35; }
  #imuReadout:empty { display: none; }
  /* Local-only timing/fps readout -- see mobileCapture.ts's own comment on
     why this is never sent over the network. */
  #poseReadout {
    position: fixed; top: max(36px, calc(env(safe-area-inset-top) + 24px)); left: 12px; right: 12px; z-index: 10;
    font-family: monospace; font-size: 12px; color: #9f9;
    text-shadow: 0 0 6px #000, 0 0 6px #000;
    display: none;
  }
  #poseReadout.visible { display: block; }
  #homeLink {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 20;
    color: #6c9; font-family: monospace; font-size: 12px; text-decoration: none;
    background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 999px;
  }
</style>
</head>
<body>
<a id="homeLink" href="/">&larr; home</a>
<video id="v" autoplay playsinline muted></video>
<canvas id="captureCanvas"></canvas>
<canvas id="arCanvas"></canvas>
<div id="status"><span id="camStatus">starting camera…</span><span id="relayStatus">relay: connecting…</span></div>
<div id="poseReadout"></div>
<div id="zoomBox"><span>zoom</span><input type="range" id="zoom" min="0" max="1" step="0.01" value="0" disabled></div>
<div id="resBox"><span>res</span><select id="resSelect" disabled><option>starting camera…</option></select><button id="detectResBtn" type="button">detect</button><button id="probeLogToggleBtn" type="button">log</button></div>
<div id="probeLogPanel">
  <div class="probeLogHeader"><span>probe log</span><button id="probeLogCloseBtn" type="button">&times;</button></div>
  <table>
    <thead><tr><th>requested</th><th>resolved?</th><th>actual</th><th id="probeLogMatchHeader">match?</th></tr></thead>
    <tbody id="probeLogTbody"></tbody>
  </table>
</div>
<div id="fpsBox"><span>fps</span><input type="range" id="fps" min="1" max="1" step="1" value="1" disabled><span id="fpsValue">—</span></div>
<div id="computeToggle"><label><input type="checkbox" id="computeOnDevice"> compute pose on this device</label></div>
<div id="arToggle"><label><input type="checkbox" id="arOverlayEnabled"> AR overlay (board game)</label></div>
<div id="debugToggles">
  <label><input type="checkbox" id="sendDebugInfo"> send debug info (perf impact)</label>
  <label><input type="checkbox" id="sendCapturedImage"> send captured image (perf impact)</label>
  <!-- Deliberately NOT checked by default and deliberately a checkbox rather
       than something automatic: iOS only grants devicemotion from a user
       gesture, so a tap here IS the permission request. Nothing downstream
       consumes IMU data yet (phase A is recording only). -->
  <label><input type="checkbox" id="imuEnabled"> record IMU (motion/orientation)</label>
  <!-- Independent of "record IMU" on purpose: this is the A/B switch, and it
       has to be flippable mid-session without disturbing a recording. Needs
       the motion permission that the record toggle obtains, so turning this
       on alone does nothing until that has been granted at least once. -->
  <label><input type="checkbox" id="imuCorrection"> use IMU correction</label>
  <!-- Inside the toggles box on purpose: every other panel here is
       fixed-positioned against a hand-computed `bottom`, and adding a fourth
       one to that stack means re-deriving the offsets of everything below it
       every time a row is added. Flowing inside the container it belongs to
       costs nothing and cannot drift. Empty (and zero-height) whenever the
       checkbox is off. -->
  <div id="imuReadout"></div>
</div>
<div id="modeToggle">
  <button id="modeSingleBtn" class="active" data-mode="single">photo</button>
  <button id="modeVideoBtn" data-mode="video">video</button>
</div>
<button id="switchCam" title="switch camera">&#8635;</button>
<button id="shutter" title="capture and send to Sphere Lab"></button>
<script type="module" src="/src/mobileCapture.ts"></script>
</body>
</html>
