<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pose Viewer Client</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; height: 100%; }
  /* video#v is just the MediaStream sink now -- never shown. captureCanvas
     (below) is the actual viewfinder, so what's on screen is pixel-for-pixel
     what gets analyzed/sent, not a separate resolution -- see this
     session's chat, "one canvas, one capture". Best-fit-to-screen: aspect
     ratio preserved (whatever the resolution dropdown's own selection is),
     scaled up as large as possible without clipping outside the viewport --
     the standard max-width/max-height letterbox, not a crop. */
  video#v { display: none; }
  canvas#captureCanvas {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100vw; max-height: 100vh;
  }
  /* THE AR OVERLAY IS BACK, and it is this page's OWN. A transparent THREE.js
     canvas over captureCanvas, drawing a lattice of coloured cubes standing on
     the recovered board (src/poseViewer/client/overlay.ts). What left for Table
     Topple was the BOARD GAME overlay; this one shares no code with it -- the
     two projects import nothing from one another. Cubes because what this page
     wants from an overlay is a pose-correctness readout: each cube either sits
     on its cell or it does not.
     Identical letterbox fit to captureCanvas so the two stack exactly. No
     mirror class here either -- captureCanvas's own draw already bakes in the
     front-camera flip at the pixel level (see drawCurrentFrameToCanvas), so the
     overlay lines up with whatever is already correctly oriented. */
  canvas#arCanvas {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100vw; max-height: 100vh;
    pointer-events: none; z-index: 5;
    display: none;
  }
  canvas#arCanvas.visible { display: block; }

  /* ── ONE COLLAPSIBLE PANEL, MATCHING THE SERVER'S ──────────────────────
     This page used to carry seven independently fixed-positioned pills, each
     with a hand-computed `bottom` offset stacked above the one below it
     (36px, 150px, 196px, 242px, 288px, 330px, 372px, 414px...). Adding a row
     meant re-deriving every offset above it, and the whole stack was hidden
     or shown wholesale by a `body.chromeHidden` rule that had to list every
     id by hand -- two lists to keep in step, in different places.

     It is now one panel that slides off to the left, the same mechanism
     pose-viewer-server.html's own #panel uses (same transition, same
     translateX(calc(-100% - N)), same adjacent toggle that rides along). The
     controls inside FLOW, so a new row costs nothing and can drift out of
     step with nothing.

     THE SHUTTER IS DELIBERATELY NOT IN HERE. It is the one control you want
     while looking at an unobstructed picture, which is the whole reason to
     collapse the panel in the first place -- the old chrome toggle took the
     shutter with it, so getting a clean view and taking a photo were mutually
     exclusive. */
  :root {
    /* One width, read by both the panel and the toggle that parks beside it,
       so they cannot disagree. Bounded by the viewport because this is a
       PHONE: a flat 300px like the desktop's is most of a narrow screen, and
       the toggle has to stay on it. */
    --panelW: min(320px, calc(100vw - 76px));
  }
  #panel {
    position: fixed; top: max(16px, env(safe-area-inset-top)); left: 16px; z-index: 10;
    background: rgba(20,20,20,0.85); backdrop-filter: blur(6px);
    border-radius: 10px; padding: 14px 16px;
    color: #ddd; font-family: monospace; font-size: 13px;
    width: var(--panelW);
    /* Stops well short of the bottom so the shutter is never underneath it --
       the shutter occupies roughly the lowest 120px, and being able to reach
       it with the panel open is the point of leaving it outside. */
    max-height: calc(100vh - 150px);
    overflow-y: auto;
    transition: transform 0.25s ease;
  }
  #panel.collapsed { transform: translateX(calc(-100% - 32px)); }
  #panelToggle {
    position: fixed; top: max(16px, env(safe-area-inset-top));
    left: calc(16px + var(--panelW) + 6px); z-index: 11;
    width: 32px; height: 32px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(20,20,20,0.85); backdrop-filter: blur(6px);
    color: #ccc; font-family: monospace; font-size: 15px; line-height: 1; cursor: pointer;
    transition: left 0.25s ease;
  }
  #panelToggle.collapsed { left: 16px; }
  #panel h1 { font-size: 15px; color: #fff; margin-bottom: 6px; }
  #panel h2 {
    font-size: 11px; color: #888; font-weight: normal; text-transform: uppercase;
    letter-spacing: 0.08em; margin: 14px 0 6px; border-top: 1px solid rgba(255,255,255,0.12);
    padding-top: 10px;
  }
  #homeLink { color: #6c9; font-size: 12px; text-decoration: none; display: inline-block; margin-bottom: 10px; }
  /* Same block-button look as the server panel's .panelBtn, so the two pages
     read as one project. */
  #panel .panelBtn {
    display: block; width: 100%; padding: 8px 12px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(20,20,20,0.75); color: #ccc; font-family: monospace; font-size: 11px;
    cursor: pointer; text-align: left; margin-bottom: 6px;
  }
  #panel .panelBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  /* A labelled control on one line: the label is fixed-width so every slider
     and dropdown in the panel starts at the same x, which is what makes a
     flowing stack read as a column rather than as a pile. */
  #panel .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #panel .rowLabel { color: #888; font-size: 11px; width: 34px; flex-shrink: 0; }
  #panel .row input[type=range] { flex: 1; accent-color: #0f0; height: 20px; min-width: 0; }
  #panel .row input[type=range]:disabled { accent-color: #f00; opacity: 0.5; }
  #panel .row select {
    flex: 1; min-width: 0; background: rgba(0,0,0,0.4); color: #fff;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 6px;
    padding: 4px 8px; font-family: monospace; font-size: 12px;
  }
  #panel .row select:disabled { opacity: 0.5; }
  #panel label {
    color: #ccc; font-size: 12px; display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; line-height: 1.3;
  }
  #panel label input { accent-color: #0f0; flex-shrink: 0; }
  /* Each toggle group keeps the accent colour it had as its own pill, so the
     grouping survives the move into one panel. */
  #arToggleLabel input { accent-color: #33aaff; }
  #debugSection label input { accent-color: #f80; }
  #fpsValue { min-width: 52px; text-align: right; color: #fff; font-size: 12px; }

  #status { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 6px; }
  #camStatus { color: #0f0; }
  #relayStatus { color: #6cf; }
  #relayStatus.down { color: #f66; }
  /* Local-only pose/fix readout -- see client/main.ts's reportPoseStatus on
     why it carries no milliseconds. Hidden until device-compute is on. */
  #poseReadout { color: #9f9; font-size: 11px; line-height: 1.35; margin-bottom: 6px; display: none; }
  #poseReadout.visible { display: block; }
  /* white-space: pre-line so updateImuReadout's two-line string breaks where
     its \n says to, without needing markup for the second line. :empty
     collapses the box entirely when the toggle is off. */
  #imuReadout { color: #9cf; font-size: 11px; white-space: pre-line; line-height: 1.35; margin-bottom: 6px; }
  #imuReadout:empty { display: none; }
  #reloadConfigStatus { color: #9cf; font-size: 11px; }
  #reloadConfigStatus:empty { display: none; }

  #modeToggle { display: flex; gap: 4px; flex: 1; }
  #modeToggle button {
    flex: 1; border: 1px solid rgba(255,255,255,0.2); background: rgba(20,20,20,0.75);
    color: #ccc; font-family: monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px;
  }
  #modeToggle button.active { background: rgba(255,255,255,0.25); color: #fff; border-color: rgba(255,255,255,0.4); }

  /* Diagnostic table of every probe the last sweep actually ran -- see
     client/camera.ts's probeResolution/renderProbeLog: what resolution was
     requested, did getUserMedia even resolve, what did the camera ACTUALLY
     settle on (via `ideal`, so this is populated even on a "no match"), and
     did that match the request. Now FLOWS inside the panel rather than
     floating centred over the page: it is a control-panel diagnostic, and
     leaving it as a separate fixed overlay meant collapsing the panel could
     leave it stranded on screen with nothing to dismiss it. */
  #probeLogPanel {
    display: none; margin-bottom: 8px;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; padding: 8px;
    max-height: 40vh; overflow: auto;
    font-size: 11px; color: #fff;
  }
  #probeLogPanel.visible { display: block; }
  #probeLogPanel .probeLogHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #probeLogPanel .probeLogHeader span { font-weight: bold; }
  #probeLogPanel .probeLogHeader button {
    background: rgba(255,255,255,0.2); color: #fff; border: none;
    border-radius: 6px; padding: 2px 10px; font-family: monospace; font-size: 13px;
  }
  #probeLogPanel table { width: 100%; border-collapse: collapse; }
  #probeLogPanel th, #probeLogPanel td {
    padding: 3px 5px; border-bottom: 1px solid rgba(255,255,255,0.15); text-align: left; white-space: nowrap;
  }
  #probeLogPanel tr.pass td:last-child { color: #6f6; }
  #probeLogPanel tr.fail td:last-child { color: #f66; }

  /* ── The one thing outside the panel ───────────────────────────────────── */
  #shutter {
    position: fixed; bottom: max(36px, calc(env(safe-area-inset-bottom) + 24px)); left: 50%;
    transform: translateX(-50%); z-index: 10;
    width: 84px; height: 84px; border-radius: 50%;
    border: 4px solid #fff; background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px); transition: background 0.15s ease;
  }
  #shutter:active { background: rgba(255,255,255,0.45); }
  /* Pose Viewer is still crunching the last frame -- shown regardless of
     photo/video mode. #shutter.sent (the brief post-send flash) is declared
     after this on purpose so it wins for its 300ms even if a capture
     happens to land right as we optimistically go not-ready. */
  #shutter.notReady { background: rgba(230,200,20,0.75); border-color: #fd0; }
  #shutter.sent { background: rgba(60,220,110,0.75); border-color: #6f6; }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="captureCanvas"></canvas>
<canvas id="arCanvas"></canvas>

<button id="panelToggle" type="button" title="show/hide controls">&lsaquo;</button>
<div id="panel">
  <h1>Pose Viewer Client</h1>
  <a id="homeLink" href="/">&larr; home</a>
  <div id="status"><span id="camStatus">starting camera…</span><span id="relayStatus">relay: connecting…</span></div>
  <div id="poseReadout"></div>

  <h2>capture</h2>
  <div class="row">
    <span class="rowLabel">mode</span>
    <div id="modeToggle">
      <button id="modeSingleBtn" class="active" data-mode="single">photo</button>
      <button id="modeVideoBtn" data-mode="video">video</button>
    </div>
  </div>
  <button id="switchCam" class="panelBtn" type="button" title="switch camera">&#8635; switch camera</button>
  <div class="row"><span class="rowLabel">zoom</span><input type="range" id="zoom" min="0" max="1" step="0.01" value="0" disabled></div>
  <!-- Frame rate -- bounds are 1fps (a full second between frames, the
       slowest end anyone would want) to whatever the camera's own
       getCapabilities().frameRate.max reports as fastest (see
       setupFramerateControl in client/camera.ts) -- a lever against motion
       blur: a higher requested rate caps how long auto-exposure is allowed to
       leave the shutter open, since exposure can't exceed the frame interval. -->
  <div class="row"><span class="rowLabel">fps</span><input type="range" id="fps" min="1" max="1" step="1" value="1" disabled><span id="fpsValue">—</span></div>
  <!-- Candidates confirmed unsupported by sweepResolutionCandidates
       (client/camera.ts) are left OUT of this list entirely, not shown
       disabled -- the full detail of why each one failed lives in the probe
       log below instead. -->
  <div class="row"><span class="rowLabel">res</span><select id="resSelect" disabled><option>starting camera…</option></select></div>
  <!-- Deliberately a manual, deliberate action, not something that runs
       automatically -- see sweepResolutionCandidates' own comment: an
       unpaced auto-run of this crashed Chrome on a real phone. -->
  <button id="detectResBtn" class="panelBtn" type="button">detect resolutions</button>
  <button id="probeLogToggleBtn" class="panelBtn" type="button">probe log</button>
  <div id="probeLogPanel">
    <div class="probeLogHeader"><span>probe log</span><button id="probeLogCloseBtn" type="button">&times;</button></div>
    <table>
      <thead><tr><th>requested</th><th>resolved?</th><th>actual</th><th id="probeLogMatchHeader">match?</th></tr></thead>
      <tbody id="probeLogTbody"></tbody>
    </table>
  </div>

  <h2>pose</h2>
  <label><input type="checkbox" id="computeOnDevice"> compute pose on this device</label>
  <!-- Independent of "compute pose on this device" on purpose even though it
       can only draw when that is on: the overlay is the expensive thing to
       look at and the cheap thing to switch off, and the pose readout is
       worth keeping while the picture is unobstructed. -->
  <label id="arToggleLabel"><input type="checkbox" id="arOverlayEnabled"> AR overlay (cubes on the board)</label>

  <h2>debug</h2>
  <div id="debugSection">
    <!-- Debug-only, OFF by default -- extra payload on top of the poseResult
         message (raw image bytes and/or intermediate pipeline data), both a
         real per-frame cost (JPEG encode, extra serialization), so each is its
         own toggle rather than riding along with computeOnDevice. -->
    <label><input type="checkbox" id="sendDebugInfo"> send debug info (perf impact)</label>
    <label><input type="checkbox" id="sendCapturedImage"> send captured image (perf impact)</label>
    <!-- Deliberately NOT checked by default and deliberately a checkbox rather
         than something automatic: iOS only grants devicemotion from a user
         gesture, so a tap here IS the permission request. -->
    <label><input type="checkbox" id="imuEnabled"> record IMU (motion/orientation)</label>
    <!-- Independent of "record IMU" on purpose: this is the A/B switch, and it
         has to be flippable mid-session without disturbing a recording. Needs
         the motion permission that the record toggle obtains, so turning this
         on alone does nothing until that has been granted at least once. -->
    <label><input type="checkbox" id="imuCorrection"> use IMU correction</label>
  </div>
  <div id="imuReadout"></div>
  <!-- Explicit, because this page has no other way to pick up a config edit:
       it does not write the localStorage overlay at all (only
       pose-viewer-server.html does), so its toggles are whatever the FILE said
       at load. Re-reads the file and applies it in place rather than reloading
       -- a reload here would drop the camera stream and the websocket, and the
       desktop would see the reconnect as a whole new phone. -->
  <button id="reloadConfigBtn" class="panelBtn" type="button">reload config from disk</button>
  <div id="reloadConfigStatus"></div>
</div>

<button id="shutter" title="capture and send to Pose Viewer"></button>
<script type="module" src="/src/poseViewer/client/main.ts"></script>
</body>
</html>
