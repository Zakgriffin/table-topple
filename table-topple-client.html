<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Table Topple Client</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; height: 100%; }

  /* video#v is just the MediaStream sink -- never shown. #viewfinder is the
     actual picture on screen, drawn from it every display frame (see
     client/camera.ts's drawViewfinder), downscaled to the screen's own
     physical pixels. Best-fit-to-screen: aspect ratio preserved, scaled up as
     large as possible without clipping -- the standard max-width/max-height
     letterbox, not a crop. */
  video#v { display: none; }
  canvas#viewfinder {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100vw; max-height: 100vh;
  }

  /* The AR overlay -- a transparent THREE.js canvas placed exactly over
     #viewfinder, rendering the board game from a camera at the recovered pose
     (the same FOV and aspect the pose pipeline itself used), so when the decode
     is good the virtual board visually lands on the real printed pattern in the
     live feed underneath it. Both boards are 144 cells across, so that landing
     is 1:1, cell for cell.

     THE IDENTICAL LETTERBOX BELOW IS LOAD-BEARING, not tidiness. overlay.ts's
     syncOverlayRendererSize keeps this canvas's INTRINSIC buffer dimensions
     equal to #viewfinder's, and these rules then apply the same fit to both --
     which is the whole mechanism registering the overlay with the picture. A
     difference in either half shows up as a board that is subtly offset or
     scaled, which reads as a pose error rather than a CSS one.

     No mirror transform anywhere, on either canvas, deliberately: the pixels
     drawn and the pixels analyzed are the same pixels, and a mirrored image
     decodes to a wrong-handed pose. See client/camera.ts. */
  canvas#arCanvas {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100vw; max-height: 100vh;
    pointer-events: none;
  }

  #status {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 62px;
    z-index: 10;
    font: 12px/1.4 monospace; color: #cfc;
    background: rgba(0,0,0,0.55); border-radius: 8px; padding: 8px 10px;
    text-shadow: 0 1px 2px #000;
  }

  #chromeToggle {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5);
    color: #eee; font: 16px/1 monospace; cursor: pointer;
  }
  #chromeToggle.active { background: rgba(255,255,255,0.25); }

  /* What counts as chrome, kept HERE next to the elements it names rather than
     as a list of handles in the entry point -- so the list cannot drift out of
     step with the markup. The game and the feed are what remain. */
  body.chromeHidden #status { display: none; }
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="viewfinder"></canvas>
<canvas id="arCanvas"></canvas>

<div id="status">booting…</div>
<button id="chromeToggle" aria-pressed="false" title="hide the readout">◐</button>

<script type="module" src="/src/tableTopple/client/main.ts"></script>
</body>
</html>
