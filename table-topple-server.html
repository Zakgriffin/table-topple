<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Table Topple Server</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* The current turn's team colour, "r, g, b" so rgba(var(--team-rgb), a) can
     still pick its own opacity per rule -- set from turns.ts, read by
     #modeToggle button.active and #turnToggle. Defaults to red, matching the
     board's own opening turn. */
  :root { --team-rgb: 255, 85, 85; }
  body { background: #0a0a0f; overflow: hidden; font-family: monospace; }
  canvas#gl { display: block; }

  /* Navigation only -- the controls explain themselves by being used. */
  #home {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    color: #555; font-size: 11px; text-decoration: none;
  }
  #home:hover { color: #6c9; }

  /* Segmented control: all three modes visible at once, the active one lit.
     A single cycling button would hide which mode comes next. */
  #modeToggle {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    display: flex; gap: 4px; padding: 4px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(20,20,20,0.85); backdrop-filter: blur(6px);
  }
  #modeToggle button {
    padding: 8px 12px; border-radius: 7px; border: 1px solid transparent;
    background: transparent; color: #999;
    font-family: monospace; font-size: 12px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  #modeToggle button:hover { background: rgba(255,255,255,0.07); color: #ccc; }
  /* Active segment takes the CURRENT TURN's colour, not always red -- see
     turns.ts's own paintTeamColor. */
  #modeToggle button.active {
    background: rgba(var(--team-rgb), 0.55); border-color: rgb(var(--team-rgb)); color: #fff;
  }
  #modeToggle button .key {
    display: block; font-size: 9px; opacity: 0.6; margin-top: 2px;
  }

  /* Weapon rack, directly under the mode bar: a separate axis from the mode,
     so it gets its own row rather than more mode segments. */
  #weaponToggle {
    position: fixed; top: 66px; right: 16px; z-index: 10;
    display: flex; gap: 4px; padding: 4px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(20,20,20,0.7); backdrop-filter: blur(6px);
  }
  #weaponToggle button {
    padding: 6px 10px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: #888;
    font-family: monospace; font-size: 11px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  #weaponToggle button:hover { background: rgba(255,255,255,0.07); color: #ccc; }
  #weaponToggle button.active {
    background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.4); color: #fff;
  }
  #weaponToggle button .key {
    display: block; font-size: 9px; opacity: 0.5; margin-top: 1px;
  }

  /* Battle switch, opposite corner from the mode bar: it isn't an input mode,
     it's a thing happening to the world. */
  #battleToggle {
    position: fixed; bottom: 16px; right: 16px; z-index: 10;
    padding: 10px 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(20,20,20,0.85); backdrop-filter: blur(6px);
    color: #999; font-family: monospace; font-size: 12px; cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #battleToggle:hover { background: rgba(255,255,255,0.08); color: #ccc; }
  #battleToggle.active {
    background: rgba(230,70,70,0.6); border-color: #e64646; color: #fff;
  }

  /* Opens the current turn's stockpile (inventory.ts) -- stacked above
     battleToggle, same side. Wears the current turn's colour like
     #turnToggle: it's THAT court's items on show. */
  #inventoryToggle {
    position: fixed; bottom: 76px; right: 16px; z-index: 10;
    padding: 10px 16px; border-radius: 10px;
    border: 1px solid rgba(var(--team-rgb), 0.5);
    background: rgba(var(--team-rgb), 0.22); backdrop-filter: blur(6px);
    color: #fff; font-family: monospace; font-size: 12px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  #inventoryToggle:hover { background: rgba(var(--team-rgb), 0.32); }
  #inventoryToggle.active { background: rgba(var(--team-rgb), 0.45); }

  /* Dims the board behind the panel, and closes it on a click -- the usual
     modal convention. Hidden by default; inventory.ts's wireInventoryPanel
     toggles style.display on both this and the panel together. */
  #inventoryOverlay {
    position: fixed; inset: 0; z-index: 19;
    display: none;
    background: rgba(0,0,0,0.55);
  }
  /* Centered, portrait: a column of four resource cards rather than a
     corner strip, since this is something you stop and look at rather than
     a control you glance at mid-play. */
  #inventoryPanel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 20; display: none;
    width: 250px;
    padding: 18px; border-radius: 18px;
    border: 1px solid rgba(var(--team-rgb), 0.5);
    background: rgba(20,20,20,0.94); backdrop-filter: blur(10px);
    color: #eee; font-family: monospace;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .inv-title {
    text-align: center; font-size: 13px; margin-bottom: 14px;
    color: rgb(var(--team-rgb));
  }
  .inv-grid { display: flex; flex-direction: column; gap: 10px; }
  /* One rounded-square card per resource: the 3D icon alongside its count. */
  .inv-card {
    display: flex; align-items: center; gap: 14px;
    padding: 10px; border-radius: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
  }
  .inv-icon {
    flex: none; width: 56px; height: 56px; border-radius: 12px;
    background: rgba(0,0,0,0.25);
  }
  .inv-text { display: flex; flex-direction: column; }
  .inv-label { font-size: 10px; color: #999; letter-spacing: 0.04em; }
  .inv-count { font-size: 22px; font-weight: bold; }

  /* Advances to the next court, counter-clockwise (turns.ts) -- bottom-left,
     opposite the mode bar, and stacked BELOW confirmRoadBtn so the two never
     overlap on the rare occasion both are visible (mid-road-drag on a turn
     that's about to end). Wears the current turn's own colour, same
     --team-rgb #modeToggle's active segment reads. */
  #turnToggle {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    padding: 10px 16px; border-radius: 10px;
    border: 1px solid rgba(var(--team-rgb), 0.5);
    background: rgba(var(--team-rgb), 0.22); backdrop-filter: blur(6px);
    color: #fff; font-family: monospace; font-size: 12px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  #turnToggle:hover { background: rgba(var(--team-rgb), 0.32); }

  /* Confirms every road blueprint at once (roads.ts) -- stacked above
     #turnToggle rather than sharing its spot. No .active state, unlike
     battleToggle -- it doesn't toggle, it fires. Hidden outside road mode;
     roads.ts sets style.display directly, same idiom aim.ts uses for
     #crosshair. */
  #confirmRoadBtn {
    position: fixed; bottom: 76px; left: 16px; z-index: 10;
    display: none;
    padding: 10px 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(20,20,20,0.85); backdrop-filter: blur(6px);
    color: #999; font-family: monospace; font-size: 12px; cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #confirmRoadBtn:hover { background: rgba(255,255,255,0.08); color: #ccc; }

  /* The reticle. Not the OS cursor -- pointer lock takes that away, and this
     is drawn at a position the game owns (see aim.ts). A ring plus a center
     dot stays readable over both the dark floor and a lit castle wall. */
  #crosshair {
    position: fixed; top: 0; left: 0; z-index: 9;
    width: 22px; height: 22px; display: none; pointer-events: none;
    border: 1.5px solid rgba(255,255,255,0.85); border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.5);
  }
  #crosshair::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
    background: #fff; border-radius: 50%;
  }
  /* Charge ring: a conic sweep that fills as a bow is drawn or a staff
     charges. Sits around the reticle so the eye never has to leave the aim
     point to read it. */
  #charge {
    position: absolute; left: 50%; top: 50%; width: 40px; height: 40px;
    margin: -20px 0 0 -20px; border-radius: 50%; opacity: 0;
    background: conic-gradient(#8fd8ff calc(var(--charge, 0) * 360deg), transparent 0);
    -webkit-mask: radial-gradient(circle, transparent 13px, #000 14px, #000 17px, transparent 18px);
    mask: radial-gradient(circle, transparent 13px, #000 14px, #000 17px, transparent 18px);
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="modeToggle">
  <button data-mode="camera" type="button"></button>
  <button data-mode="path" type="button"></button>
  <button data-mode="road" type="button"></button>
  <button data-mode="fight" type="button"></button>
  <button data-mode="act" type="button"></button>
</div>
<div id="weaponToggle">
  <button data-weapon="sword" type="button"></button>
  <button data-weapon="bow" type="button"></button>
  <button data-weapon="staff" type="button"></button>
</div>
<div id="crosshair"><div id="charge"></div></div>
<button id="battleToggle" type="button">battle: off</button>
<button id="inventoryToggle" type="button">inventory</button>
<div id="inventoryOverlay"></div>
<div id="inventoryPanel">
  <div class="inv-title">red's inventory</div>
  <div class="inv-grid">
    <div class="inv-card">
      <canvas class="inv-icon" data-icon="wood"></canvas>
      <div class="inv-text"><span class="inv-label">wood</span><span class="inv-count" data-resource="wood">0</span></div>
    </div>
    <div class="inv-card">
      <canvas class="inv-icon" data-icon="metal"></canvas>
      <div class="inv-text"><span class="inv-label">metal</span><span class="inv-count" data-resource="metal">0</span></div>
    </div>
    <div class="inv-card">
      <canvas class="inv-icon" data-icon="string"></canvas>
      <div class="inv-text"><span class="inv-label">string</span><span class="inv-count" data-resource="string">0</span></div>
    </div>
    <div class="inv-card">
      <canvas class="inv-icon" data-icon="aether"></canvas>
      <div class="inv-text"><span class="inv-label">aether</span><span class="inv-count" data-resource="aether">0</span></div>
    </div>
  </div>
</div>
<button id="turnToggle" type="button">red's turn</button>
<button id="confirmRoadBtn" type="button">confirm road</button>
<a id="home" href="/index.html">&larr; home</a>
<script type="module" src="/src/tableTopple/server/main.ts"></script>
</body>
</html>
